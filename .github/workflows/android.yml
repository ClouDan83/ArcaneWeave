name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore Arcane Waves v1.2 source
        run: |
          base64 -d build_sources/MainActivity.java.gz.b64 | gzip -d > app/src/main/java/com/bazaverse/arcanewaves/MainActivity.java
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ArcaneWaves-v1.2.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
