name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore Arcane Waves v2.2 animated source
        run: |
          cat build_sources/v22/source.part00.b64 build_sources/v22/source.part01.b64 build_sources/v22/source.part02.b64 build_sources/v22/source.part03.b64 | tr -d '\n' | base64 -d | gzip -d > app/src/main/java/com/bazaverse/arcanewaves/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/bazaverse/arcanewaves/MainActivity.java')
          s = p.read_text()
          old = '        float shopButtonTop() { return safeBottom() - 82f; }\n        float campRestButtonTop() { return safeTop() + 188f; }\n        float campOffersTop() { return safeTop() + 356f; }'
          new = '        float shopButtonTop() { return safeBottom() - 72f; }\n        float campRestButtonTop() { return safeTop() + 188f; }\n        float campServiceTop() { return Math.max(safeTop() + 150f, safeBottom() - 520f); }\n        float campOffersTop() { return campServiceTop() + 154f; }'
          if old not in s:
              raise SystemExit('camp helper insertion target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'drawAnimatedBoss' app/src/main/java/com/bazaverse/arcanewaves/MainActivity.java
          grep -q 'drawSkillOrb' app/src/main/java/com/bazaverse/arcanewaves/MainActivity.java
          grep -q 'drawHeroLeg' app/src/main/java/com/bazaverse/arcanewaves/MainActivity.java
          grep -q 'float campServiceTop()' app/src/main/java/com/bazaverse/arcanewaves/MainActivity.java
      - name: Restore permanent test signing key
        run: base64 -d build_sources/arcane-debug.keystore.b64 > arcane-debug.keystore
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify v2.2 dark anime assets
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/bg_menu_dark_anime.webp'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/bg_battle_dark_anime.webp'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/bg_camp_dark_anime.webp'
      - uses: actions/upload-artifact@v4
        with:
          name: ArcaneWaves-v2.2.0-animated-dark-anime
          path: app/build/outputs/apk/debug/app-debug.apk
